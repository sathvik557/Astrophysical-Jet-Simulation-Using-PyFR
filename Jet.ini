[backend]
precision = double

[constants]
gamma = 1.6667

[solver]
system = euler
order = 4
shock-capturing = entropy-filter

[solver-time-integrator]
scheme = rk4
controller = none
tstart = 0.0
tend = 0.001
dt = 2.5e-8

[solver-interfaces]
riemann-solver = hllc

[solver-interfaces-quad]
flux-pts = gauss-legendre

[solver-entropy-filter]
d-min = 1e-6
p-min = 1e-6
e-tol = 1e-6
niters = 2
formulation = nonlinear

[soln-plugin-nancheck]
nsteps = 10

[soln-plugin-writer]
dt-out = 0.0001
basedir = .
basename = jet-40-ord4-{t:.6f}

[soln-bcs-jet]
type = char-riem-inv
rho = 5.0
u = 800.0
v = 0.0
p = 0.4127

[soln-bcs-ambient_lower]
type = char-riem-inv
rho = 0.5
u = 0.0
v = 0.0
p = 0.4127

[soln-bcs-ambient_upper]
type = char-riem-inv
rho = 0.5
u = 0.0
v = 0.0
p = 0.4127

[soln-bcs-outflow]
type = char-riem-inv
rho = 0.5
u = 0.0
v = 0.0
p = 0.4127

[soln-bcs-bottom]
type = char-riem-inv
rho = 0.5
u = 0.0
v = 0.0
p = 0.4127

[soln-bcs-top]
type = char-riem-inv
rho = 0.5
u = 0.0
v = 0.0
p = 0.4127

[soln-ics]
rho = 0.5
u = 0
v = 0
p = 0.4127

[solver-elements-quad]
soln-pts = gauss-legendre

[solver-interfaces-line]
flux-pts = gauss-legendre
